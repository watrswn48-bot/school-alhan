name: Repair lecture sync
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-lecture-sync.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          storage = Path('src/services/storage.ts')
          text = storage.read_text(encoding='utf-8')
          old = "role: 'servant',"
          new = "role: 'junior_servant',"
          if old not in text:
              raise SystemExit('Expected legacy servant role literal was not found')
          storage.write_text(text.replace(old, new, 1), encoding='utf-8')

          sync = Path('src/services/syncQueue.ts')
          text = sync.read_text(encoding='utf-8')
          old = """  try {\n    isCurrentlySyncing = true;\n    notifyStatusChange();\n\n    // 1. Flush local queue to cloud\n    const { processed } = await processSyncQueue();"""
          new = """  try {\n    // processSyncQueue owns the syncing lock. Do not set it before calling it,\n    // otherwise processSyncQueue sees an active sync and refuses to flush the queue.\n    // 1. Flush local queue to cloud\n    const { processed } = await processSyncQueue();"""
          if old not in text:
              raise SystemExit('Expected triggerFullSync locking block was not found')
          sync.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Keep the startup pull authoritative even when the students collection is empty.
          storage = Path('src/services/storage.ts')
          text = storage.read_text(encoding='utf-8')
          old = """      if (cloudData && cloudData.students && cloudData.students.length > 0) {\n        applyCloudDataToLocal(cloudData, onDataUpdated);\n      }"""
          new = """      if (cloudData) {\n        applyCloudDataToLocal(cloudData, onDataUpdated);\n      }"""
          if old not in text:
              raise SystemExit('Expected initial cloud pull condition was not found')
          storage.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repaired files and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/repair-lecture-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/storage.ts src/services/syncQueue.ts .github/workflows/repair-lecture-sync.yml
          git commit -m 'Fix automatic cloud sync and lecture persistence'
          git push