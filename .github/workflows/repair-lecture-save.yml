name: Repair lecture save

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair storage and remove one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/storage.ts')
          s = p.read_text(encoding='utf-8')
          old = "    speakerServantId: lec.speakerServantId,\n    levelName: lec.levelName || ACADEMIC_LEVELS[0],"
          new = "    speakerServantId: lec.speakerServantId,\n    schoolClass: lec.schoolClass,\n    levelName: lec.levelName || ACADEMIC_LEVELS[0],"
          if old not in s and "    schoolClass: lec.schoolClass," not in s:
              raise SystemExit('Expected saveLecture block was not found')
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/repair-lecture-save.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/storage.ts .github/workflows/repair-lecture-save.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix lecture class persistence'
          git push