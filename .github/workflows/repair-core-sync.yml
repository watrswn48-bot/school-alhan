name: Repair core sync and roles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')

          # 1) Firebase: authenticate anonymously before Firestore access.
          p='src/lib/firebase.ts'; s=read(p)
          if "firebase/auth" not in s:
              s=s.replace("import firebaseConfig from '../../firebase-applet-config.json';", "import firebaseConfig from '../../firebase-applet-config.json';\nimport { getAuth, signInAnonymously } from 'firebase/auth';")
              s=s.replace("export const db: Firestore = firestoreDb;", "export const db: Firestore = firestoreDb;\n\nexport const auth = getAuth(app);\nexport const authReady: Promise<void> = signInAnonymously(auth)\n  .then(() => undefined)\n  .catch((error) => {\n    console.error('Firebase anonymous authentication failed:', error);\n    throw error;\n  });")
              write(p,s)

          # 2) Firebase service: never swallow writer failures; wait for auth; add subject sync.
          p='src/services/firebaseService.ts'; s=read(p)
          if "authReady" not in s:
              s=s.replace("import { db } from '../lib/firebase';", "import { db, authReady } from '../lib/firebase';")
          writer_names=[
            'syncStudentToCloud','deleteStudentFromCloud','syncServantToCloud','deleteServantFromCloud',
            'syncLiturgyAttendanceToCloud','syncLectureToCloud','deleteLectureFromCloud',
            'syncLectureAttendanceToCloud','syncSubjectResultToCloud','deleteSubjectResultFromCloud',
            'syncBehaviorNoteToCloud','syncAcademicSettingsToCloud','syncCurriculumToCloud',
            'deleteCurriculumFromCloud','syncSchoolLogoToCloud','uploadAllLocalDataToFirebase',
            'fetchAllDataFromFirebase'
          ]
          for name in writer_names:
              s=re.sub(r'(export async function '+re.escape(name)+r'\([^\{]*\{)', r'\1\n  await authReady;', s, count=1)
          # Replace only Firebase writer catches that currently swallow errors.
          s=re.sub(r"(console\.warn\('Firebase [^']+ error:', error\);\n)  \}", r"\1    throw error;\n  }", s)
          if 'syncChantSubjectToCloud' not in s:
              marker='// -------------------------------------------------------------\n// BULK CLOUD SYNC & PULL HELPERS\n// -------------------------------------------------------------'
              insert="""// Chant subjects use the same offline queue as the rest of the application.\nexport async function syncChantSubjectToCloud(subject: { id: string }): Promise<void> {\n  await authReady;\n  const docRef = doc(db, 'chantSubjects', subject.id);\n  await setDoc(docRef, sanitizeForFirestore(subject), { merge: true });\n}\n\nexport async function deleteChantSubjectFromCloud(subjectId: string): Promise<void> {\n  await authReady;\n  await deleteDoc(doc(db, 'chantSubjects', subjectId));\n}\n\n"""
              s=s.replace(marker, insert+marker)
          # Real-time listeners now wait for authentication and include every synced collection.
          old="""export function listenToFirebaseUpdates(onUpdate: () => void): () => void {\n  const unsubStudents = onSnapshot(collection(db, COLLECTIONS.STUDENTS), () => onUpdate(), (err) => console.warn('Students listener:', err));\n  const unsubLiturgies = onSnapshot(collection(db, COLLECTIONS.LITURGIES), () => onUpdate(), (err) => console.warn('Liturgies listener:', err));\n  const unsubLectures = onSnapshot(collection(db, COLLECTIONS.LECTURES), () => onUpdate(), (err) => console.warn('Lectures listener:', err));\n  const unsubLectureAtt = onSnapshot(collection(db, COLLECTIONS.LECTURE_ATTENDANCE), () => onUpdate(), (err) => console.warn('Lecture Attendance listener:', err));\n  const unsubCurricula = onSnapshot(collection(db, COLLECTIONS.CURRICULA), () => onUpdate(), (err) => console.warn('Curricula listener:', err));\n\n  return () => {\n    unsubStudents();\n    unsubLiturgies();\n    unsubLectures();\n    unsubLectureAtt();\n    unsubCurricula();\n  };\n}\n"""
          new="""export function listenToFirebaseUpdates(onUpdate: () => void): () => void {\n  let active = true;\n  const unsubscribers: (() => void)[] = [];\n  authReady.then(() => {\n    if (!active) return;\n    const watch = (name: string) => onSnapshot(collection(db, name), () => onUpdate(), (err) => console.warn(`${name} listener:`, err));\n    [COLLECTIONS.STUDENTS, COLLECTIONS.SERVANTS, COLLECTIONS.LITURGIES, COLLECTIONS.LECTURES, COLLECTIONS.LECTURE_ATTENDANCE, COLLECTIONS.SUBJECT_RESULTS, COLLECTIONS.BEHAVIOR_NOTES, COLLECTIONS.CURRICULA, COLLECTIONS.SYSTEM_SETTINGS].forEach(name => unsubscribers.push(watch(name)));\n  }).catch((err) => console.warn('Firebase listener authentication:', err));\n  return () => { active = false; unsubscribers.splice(0).forEach(unsub => unsub()); };\n}\n"""
          if old in s: s=s.replace(old,new)
          write(p,s)

          # 3) Firestore rules: require an authenticated Firebase session instead of denying everything.
          write('firestore.rules', """rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if request.auth != null;\n    }\n  }\n}\n""")

          # 4) Offline queue: subject mutations + keep failed mutations instead of deleting them after 5 attempts.
          p='src/services/syncQueue.ts'; s=read(p)
          s=s.replace("  syncSchoolLogoToCloud,", "  syncSchoolLogoToCloud,\n  syncChantSubjectToCloud,\n  deleteChantSubjectFromCloud,")
          s=s.replace("  | 'save_school_logo';", "  | 'save_school_logo'\n  | 'save_chant_subject'\n  | 'delete_chant_subject';")
          s=s.replace("    case 'save_school_logo':\n      await syncSchoolLogoToCloud(mutation.payload);\n      break;", "    case 'save_school_logo':\n      await syncSchoolLogoToCloud(mutation.payload);\n      break;\n    case 'save_chant_subject':\n      await syncChantSubjectToCloud(mutation.payload);\n      break;\n    case 'delete_chant_subject':\n      await deleteChantSubjectFromCloud(mutation.payload);\n      break;")
          s=s.replace("      // If it failed fewer than 5 times, keep it in queue to retry later\n      if (mutation.retryCount < 5) {\n        remainingQueue.push(mutation);\n      } else {\n        console.error(`Giving up on mutation ${mutation.id} after 5 failed attempts`);\n      }", "      // Never discard a failed write. Keep it queued for a later reconnect/retry.\n      remainingQueue.push(mutation);")
          write(p,s)

          # 5) Subjects: queue writes instead of silently losing them offline.
          p='src/services/schoolSystem.ts'; s=read(p)
          if "enqueueMutation" not in s:
              s=s.replace("import { egyptDateString, isEgyptFriday } from './egyptTime';", "import { egyptDateString, isEgyptFriday } from './egyptTime';\nimport { enqueueMutation } from './syncQueue';")
          s=s.replace("try{await setDoc(doc(db,'chantSubjects',item.id),item,{merge:true});}catch{}return item;", "enqueueMutation('save_chant_subject', item); return item;")
          s=s.replace("try{await deleteDoc(doc(db,'chantSubjects',id));}catch{}", "enqueueMutation('delete_chant_subject', id);")
          # Friday attendance must enter the queue too.
          target="localStorage.setItem('deacon_system_liturgies_v1',JSON.stringify([...getLiturgyAttendances().filter(r=>!(r.studentId===student.id&&r.dateStr===dateStr)),record]));window.dispatchEvent"
          repl="localStorage.setItem('deacon_system_liturgies_v1',JSON.stringify([...getLiturgyAttendances().filter(r=>!(r.studentId===student.id&&r.dateStr===dateStr)),record]));enqueueMutation('save_liturgy', record);window.dispatchEvent"
          s=s.replace(target,repl)
          write(p,s)

          # 6) Remove the destructive legacy-lecture cleanup. Missing class is preserved; new lectures already save class.
          p='src/components/LectureSystemModule.tsx'; s=read(p)
          pattern=r"\n  // Remove legacy lectures created before the class field was mandatory\..*?\n  \},\[\]\);\n"
          s,n=re.subn(pattern,'\n',s,flags=re.S,count=1)
          if n==0:
              # Fallback: remove the exact effect by its distinctive first line through the closing setVersion call.
              s=re.sub(r"\n  useEffect\(\(\)=>\{\n    const current=getLectures\(\);\n    const legacy=current\.filter\(l=>!l\.schoolClass.*?setVersion\(v=>v\+1\);\n  \},\[\]\);\n",'\n',s,flags=re.S,count=1)
          # Preserve legacy lectures in the list instead of filtering them out.
          s=s.replace("lectures.filter(l => l.schoolClass && SCHOOL_CLASSES.includes(normalizeSchoolClass(l.schoolClass))", "lectures.filter(l => (!l.schoolClass || SCHOOL_CLASSES.includes(normalizeSchoolClass(l.schoolClass)))")
          write(p,s)

          # 7) Roles: exactly three visible roles; migrate legacy labels to the closest current role.
          p='src/services/permissions.ts'; s=read(p)
          s=s.replace("if ((role as string) === 'family_admin' || role === 'senior_servant')", "if ((role as string) === 'family_admin' || (role as string) === 'servant' || role === 'senior_servant')")
          write(p,s)

          p='src/components/AdminPanelModule.tsx'; s=read(p)
          s=s.replace("<div className=\"grid grid-cols-1 md:grid-cols-4 gap-3\">", "<div className=\"grid grid-cols-1 md:grid-cols-3 gap-3\">")
          s=re.sub(r"\n        <div className=\"p-4 rounded-2xl border border-sky-500/30 bg-sky-500/5\"><b className=\"text-sky-400\">أمين الأسرة</b>.*?</div>", '', s, flags=re.S, count=1)
          s=s.replace("<option value=\"family_admin\">أمين الأسرة — حضور + ملفات + تقييمات</option>", "")
          write(p,s)

          # 8) One-time local migration for legacy servant roles, duplicate secret codes, and no destructive data deletion.
          mig="""import { getServants, saveServant } from './storage';\n\nexport function runDataMigrations(): void {\n  try {\n    const servants = getServants();\n    const seen = new Set<string>();\n    for (const servant of servants) {\n      const rawRole = servant.role as string;\n      const role = rawRole === 'admin' ? 'admin' : (rawRole === 'family_admin' || rawRole === 'senior_servant') ? 'senior_servant' : 'junior_servant';\n      let code = servant.secretCode || '';\n      if (code && seen.has(code)) {\n        do { code = String(Math.floor(100000 + Math.random() * 900000)); } while (seen.has(code));\n      }\n      seen.add(code);\n      if (role !== rawRole || code !== servant.secretCode) saveServant({ ...servant, role: role as any, secretCode: code });\n    }\n  } catch (error) {\n    console.warn('Data migration skipped:', error);\n  }\n}\n"""
          write('src/services/dataMigrations.ts',mig)
          p='src/main.tsx'; s=read(p)
          if "dataMigrations" not in s:
              s=s.replace("import './services/autoSyncBootstrap';", "import './services/autoSyncBootstrap';\nimport { runDataMigrations } from './services/dataMigrations';\nrunDataMigrations();")
          write(p,s)

          # 9) Remove stale repeated migration calls from storage initializer.
          p='src/services/storage.ts'; s=read(p)
          s=re.sub(r"(  migratePriestName\(\);\n){2,}", "  migratePriestName();\n", s)
          write(p,s)
          PY

      - name: Install and build
        run: npm ci && npm run build

      - name: Commit repairs and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/repair-core-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src firestore.rules .github/workflows/repair-core-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix Firebase sync and enforce three servant roles"
          git push
