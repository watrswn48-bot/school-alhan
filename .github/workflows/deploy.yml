name: Deploy Vite React app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch result publication and student portal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Results entry: results are saved as temporary and only become
          # visible to students after the explicit "رفع النتائج" action.
          p = Path('src/components/ResultsEntryModule.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "import { AcademicTerm, getChantSubjects, refreshSubjectsFromFirebase } from '../services/schoolSystem';",
              "import { AcademicTerm, getChantSubjects, refreshSubjectsFromFirebase } from '../services/schoolSystem';\nimport { publishResults, areResultsPublished } from '../services/academicYearService';"
          )
          s = s.replace(
              "  const [scores, setScores] = useState<Record<string, string>>({});",
              "  const [scores, setScores] = useState<Record<string, string>>({});\n  const [publicationVersion, setPublicationVersion] = useState(0);"
          )
          s = s.replace(
              "  const canManage = session.role === 'admin' || session.userId === 'srv-admin-01' || sessionHasPermission(session, 'canManageGrades');",
              "  const canManage = session.role === 'admin' || session.userId === 'srv-admin-01' || sessionHasPermission(session, 'canManageGrades');\n  const resultsPublished = !!level && !!year && areResultsPublished(level, year, term);"
          )
          s = s.replace("}, [level, year, term, version]);", "}, [level, year, term, version, publicationVersion]);")
          s = s.replace("        isApproved: true,", "        isApproved: false,")
          marker = """  const resetSelection = () => {\n    setLevel('');"""
          replacement = """  const handlePublishResults = () => {\n    if (!canManage || !level || !year) return;\n    publishResults(level, year, term);\n    setPublicationVersion(v => v + 1);\n    setMessage(`تم رفع نتائج ${year} - ${term} للطلاب بنجاح.`);\n  };\n\n  const resetSelection = () => {\n    setLevel('');"""
          s = s.replace(marker, replacement)
          old_footer = """                <button onClick={saveStudentResults} disabled={!canManage} className=\"px-5 py-2.5 bg-amber-500 text-slate-950 rounded-xl font-black text-sm flex items-center justify-center gap-2 disabled:opacity-40\">\n                  <Save className=\"w-4 h-4\" /> حفظ نتيجة {student.fullName}\n                </button>"""
          new_footer = """                <div className=\"flex flex-wrap justify-end gap-2\">\n                  <button onClick={saveStudentResults} disabled={!canManage} className=\"px-5 py-2.5 bg-slate-800 text-amber-300 border border-slate-700 rounded-xl font-black text-sm flex items-center justify-center gap-2 disabled:opacity-40\">\n                    <Save className=\"w-4 h-4\" /> حفظ نتيجة {student.fullName}\n                  </button>\n                  <button onClick={handlePublishResults} disabled={!canManage || resultsPublished} className=\"px-5 py-2.5 bg-emerald-500 text-slate-950 rounded-xl font-black text-sm flex items-center justify-center gap-2 disabled:opacity-40\">\n                    <CheckCircle2 className=\"w-4 h-4\" /> {resultsPublished ? 'النتائج مرفوعة' : 'رفع النتائج'}\n                  </button>\n                </div>"""
          s = s.replace("import { ClipboardCheck, Save, ChevronLeft, Users, Folder, UserCheck } from 'lucide-react';", "import { ClipboardCheck, Save, ChevronLeft, Users, Folder, UserCheck, CheckCircle2 } from 'lucide-react';")
          s = s.replace(old_footer, new_footer)
          p.write_text(s, encoding='utf-8')

          # Student profile: hide unpublished results only in student mode.
          p = Path('src/components/CumulativeProfileModal.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "  getSchoolLogo,\n} from '../services/storage';",
              "  getSchoolLogo,\n} from '../services/storage';\nimport { areResultsPublished } from '../services/academicYearService';\nimport { AcademicTerm } from '../services/schoolSystem';"
          )
          s = s.replace(
              "  const [subjectResults, setSubjectResults] = useState(() => getSubjectResults(student.id));",
              "  const visibleResults = () => getSubjectResults(student.id).filter((r) => session.mode !== 'student' || (!!r.term && areResultsPublished(r.levelName || student.level, r.yearName || student.year, r.term as AcademicTerm)));\n  const [subjectResults, setSubjectResults] = useState(() => visibleResults());"
          )
          s = s.replace("setSubjectResults(getSubjectResults(student.id));", "setSubjectResults(visibleResults());")
          p.write_text(s, encoding='utf-8')
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/ResultsEntryModule.tsx src/components/CumulativeProfileModal.tsx
            git commit -m "Add explicit result publishing controls"
            git push
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
