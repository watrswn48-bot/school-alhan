name: Deploy Vite React app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair student persistence data model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/storage.ts')
          s = p.read_text(encoding='utf-8')
          original = s

          if "import { normalizeSchoolClass } from './schoolClassUtils';" not in s:
              s = s.replace(
                  "import defaultSchoolLogo from '../assets/images/deacon_school_logo_1788727828867.jpg';",
                  "import defaultSchoolLogo from '../assets/images/deacon_school_logo_1788727828867.jpg';\nimport { normalizeSchoolClass } from './schoolClassUtils';"
              )

          s = s.replace(
              "export const SCHOOL_CLASSES = ['كيجي','أولى وتانية','تالتة ورابعة','خامسة وسادسة','إعدادي','ثانوي'] as const;",
              "export const SCHOOL_CLASSES = ['كيجي','أولى وتانية','تالتة ورابعة','خامسة وسادسة','إعدادي وثانوي'] as const;"
          )

          old_get = """    const list: Student[] = JSON.parse(data);\n    return includeDeleted ? list : list.filter((s) => !s.isDeleted);"""
          new_get = """    const list: Student[] = JSON.parse(data);\n    const normalized = list.map((s) => ({ ...s, schoolClass: normalizeSchoolClass(s.schoolClass) }));\n    return includeDeleted ? normalized : normalized.filter((s) => !s.isDeleted);"""
          s = s.replace(old_get, new_get)

          old_deleted = """    const list: Student[] = JSON.parse(data);\n    return list.filter((s) => s.isDeleted);"""
          new_deleted = """    const list: Student[] = JSON.parse(data);\n    return list.map((s) => ({ ...s, schoolClass: normalizeSchoolClass(s.schoolClass) })).filter((s) => s.isDeleted);"""
          s = s.replace(old_deleted, new_deleted)

          old_update = """    const updated: Student = {\n      ...list[existingIndex],\n      ...studentData,\n    };"""
          new_update = """    const updated: Student = {\n      ...list[existingIndex],\n      ...studentData,\n      schoolClass: normalizeSchoolClass(studentData.schoolClass ?? list[existingIndex].schoolClass),\n      schoolLevel: studentData.schoolLevel ?? list[existingIndex].schoolLevel ?? '',\n      schoolYear: studentData.schoolYear ?? list[existingIndex].schoolYear ?? '',\n    };"""
          s = s.replace(old_update, new_update)

          old_new = """      levelIndex: levelIdx,\n      yearIndex: yearIdx,\n      phone: studentData.phone || '',"""
          new_new = """      levelIndex: levelIdx,\n      yearIndex: yearIdx,\n      schoolClass: normalizeSchoolClass(studentData.schoolClass),\n      schoolLevel: studentData.schoolLevel || '',\n      schoolYear: studentData.schoolYear || '',\n      phone: studentData.phone || '',"""
          s = s.replace(old_new, new_new)

          s = s.replace(
              "cloudData.students.forEach((s: Student) => mergedMap.set(s.id, s));",
              "cloudData.students.forEach((s: Student) => mergedMap.set(s.id, { ...s, schoolClass: normalizeSchoolClass(s.schoolClass) }));"
          )

          if s != original:
              p.write_text(s, encoding='utf-8')
          PY

          rm -f src/services/storage.ts.tmp-check src/services/storage.fixed.ts

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/services/storage.ts src/services/storage.ts.tmp-check src/services/storage.fixed.ts
            git commit -m "Fix student school data persistence"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
